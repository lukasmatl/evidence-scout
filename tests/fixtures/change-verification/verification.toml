schema_version = 1

[profiles.demo]
environment_allowlist = ["PATH", "LANG", "TMPDIR"]
workspace_input_paths = ["integration/**"]
workspace_protected_paths = ["integration/check_contracts.py"]

[profiles.demo.repositories.api]
protected_paths = ["scripts/check.py"]

[profiles.demo.repositories.client]
protected_paths = ["scripts/check.py"]

[profiles.demo.repositories.schemas]

[[profiles.demo.steps]]
id = "api-check"
scope = "repository"
repository = "api"
argv = ["python3", "scripts/check.py"]

[[profiles.demo.steps]]
id = "client-check"
scope = "repository"
repository = "client"
argv = ["python3", "scripts/check.py"]

[[profiles.demo.steps]]
id = "cross-repository-contract"
scope = "workspace"
repositories = ["api", "client", "schemas"]
argv = ["python3", "integration/check_contracts.py"]
